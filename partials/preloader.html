<style id="ank-pl-css">
#ank-pl{
  /* one timeline, one place to retune it — every keyframe below hangs off these */
  --t-cross:90ms; --t-ring:280ms; --t-regout:470ms;
  --t-outer:500ms; --t-inner:1000ms; --t-fill:1190ms; --t-strokeout:1260ms;
  --t-leaf:1380ms; --t-wipe:1560ms; --t-shift:1560ms;
  --t-labs:2060ms; --t-guide:2110ms; --t-guideout:2470ms;
  --t-drift:2720ms; --t-gridout:2900ms; --t-exit:2980ms;
  --pl-out:cubic-bezier(.25,.6,.35,1);   /* moves straight away, then eases off — an ease-in-out here reads as a hold-then-yank */
  --pl-ink:#074326;              /* brand green, straight off the logo artwork */
  --pl-ink-soft:rgba(7,67,38,.30);
  --pl-pen:cubic-bezier(.55,.08,.3,1);

  position:fixed;inset:0;z-index:2147483600;display:none;place-items:center;
  /* graph-paper.webp is an opaque sheet whose own base is #FCFAF6, so that — not
     the #F4F1E7 the homepage pairs it with — is the colour actually on screen.
     Matching it here keeps the ground steady from first paint to texture load. */
  background:#FCFAF6;overflow:hidden;contain:layout paint;
  font-family:"Basis Grotesque Pro","BasisGrotesque",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
/* pl-handoff is a no-op animation whose only job is to fire animationstart at the
   exact frame the fade begins — that is the cue to give the page back, so the
   reveal can never drift out of step with the fade. */
#ank-pl.pl-run{display:grid;
  animation:pl-exit 720ms var(--pl-out) var(--t-exit) forwards,
            pl-handoff 1ms linear var(--t-exit) forwards;}
#ank-pl.is-skip{animation:pl-exit 260ms ease forwards!important;}
@keyframes pl-exit{to{opacity:0}}
@keyframes pl-handoff{from{outline-color:transparent}to{outline-color:transparent}}

/* --- the working canvas -------------------------------------------------- */
.pl-grid{
  /* the same sheet the homepage sections sit on: #F4F1E7 + graph-paper.webp at 760px */
  position:absolute;inset:-12%;pointer-events:none;opacity:0;
  background:url(/images/texture/graph-paper.webp) repeat;
  background-size:760px;
  will-change:transform,opacity;
}
.pl-run .pl-grid{
  /* a continuous tile, so any drift distance translates cleanly — this is just
     far enough to register as movement without reading as a pan */
  animation:pl-gridin 520ms ease 60ms forwards,
            pl-drift 1200ms cubic-bezier(.35,0,.25,1) var(--t-drift) forwards,
            pl-gridout 620ms var(--pl-out) var(--t-gridout) forwards;
}
@keyframes pl-gridin{to{opacity:1}}
@keyframes pl-drift{to{transform:translate3d(-46px,-46px,0)}}
@keyframes pl-gridout{to{opacity:0}}

.pl-coord{
  position:absolute;font-size:10px;font-weight:500;line-height:1;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(7,67,38,.26);pointer-events:none;user-select:none;opacity:0;
}
.pl-run .pl-coord{animation:pl-gridin 900ms ease 220ms forwards;}
.pl-coord-tl{top:24px;left:26px;}
.pl-coord-tr{top:24px;right:26px;}
.pl-coord-bl{bottom:24px;left:26px;}
.pl-coord-br{bottom:24px;right:26px;}

/* --- the mark ------------------------------------------------------------ */
.pl-mark{position:relative;width:clamp(206px,44vw,376px);height:auto;overflow:visible;}
.pl-run .pl-mark{animation:pl-markout 720ms var(--pl-out) var(--t-exit) forwards;}
@keyframes pl-markout{to{transform:translateY(-9px) scale(1.045)}}

.pl-shift{transform-box:view-box;transform-origin:0 0;transform:translate(234.5px,18.5px);}
.pl-run .pl-shift{animation:pl-shift 640ms cubic-bezier(.5,.05,.2,1) var(--t-shift) forwards;}
@keyframes pl-shift{to{transform:translate(0,0)}}

/* 01 — registration mark */
.pl-reg{opacity:0;}
.pl-reg rect{fill:var(--pl-ink);transform-box:fill-box;transform-origin:50% 50%;}
.pl-reg-h{transform:scaleX(0);}
.pl-reg-v{transform:scaleY(0);}
.pl-reg circle{fill:none;stroke:var(--pl-ink);stroke-width:1.6;
  transform-box:fill-box;transform-origin:50% 50%;transform:scale(.1);opacity:0;}
.pl-run .pl-reg{animation:pl-in 180ms ease var(--t-cross) forwards,
                          pl-out 200ms ease var(--t-regout) forwards;}
.pl-run .pl-reg-h{animation:pl-cross-h 240ms cubic-bezier(.25,.9,.3,1) var(--t-cross) forwards;}
.pl-run .pl-reg-v{animation:pl-cross-v 240ms cubic-bezier(.25,.9,.3,1) calc(var(--t-cross) + 40ms) forwards;}
@keyframes pl-cross-h{to{transform:scaleX(1)}}
@keyframes pl-cross-v{to{transform:scaleY(1)}}
.pl-run .pl-reg-o{animation:pl-ring 220ms cubic-bezier(.3,1.3,.5,1) var(--t-ring) forwards;}
@keyframes pl-ring{to{transform:scale(1);opacity:.7}}

/* 02 — the first stroke: the A traced like a plotter, then flooded with ink */
.pl-stroke path{fill:none;stroke:var(--pl-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;}
.pl-run .pl-stroke{animation:pl-out 200ms ease var(--t-strokeout) forwards;}
.pl-run .pl-s-outer{animation:pl-draw 760ms var(--pl-pen) var(--t-outer) forwards;}
.pl-run .pl-s-inner{animation:pl-draw 280ms var(--pl-pen) var(--t-inner) forwards;}
@keyframes pl-draw{to{stroke-dashoffset:0}}

.pl-fill{opacity:0;}
.pl-run .pl-fill{animation:pl-in 260ms ease var(--t-fill) forwards;}

/* 03 — the leaf wakes up, growing out of the stem */
.pl-leaf{opacity:0;transform-box:fill-box;transform-origin:2% 98%;
  transform:scale(.06) rotate(-14deg);}
.pl-run .pl-leaf{animation:pl-leaf 300ms cubic-bezier(.34,1.4,.5,1) var(--t-leaf) forwards;}
@keyframes pl-leaf{0%{opacity:0;transform:scale(.06) rotate(-14deg)}
                   35%{opacity:1}
                   100%{opacity:1;transform:none}}

/* 04 — ink travels along the baseline and the rest of the word is simply there */
.pl-run .pl-ink-rect{animation:pl-wipe 560ms cubic-bezier(.42,.02,.28,1) var(--t-wipe) forwards;}
@keyframes pl-wipe{to{transform:translateX(800px)}}

/* 05 — Labs, over a construction guide that draws itself and leaves */
.pl-labs{opacity:0;transform-box:view-box;transform-origin:0 0;transform:translateY(10px);}
.pl-run .pl-labs{animation:pl-labs 300ms cubic-bezier(.22,.9,.3,1) var(--t-labs) forwards;}
@keyframes pl-labs{to{opacity:1;transform:translateY(0)}}

.pl-guide{stroke:var(--pl-ink-soft);stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;}
.pl-run .pl-guide{animation:pl-in 120ms linear var(--t-guide) forwards,
                            pl-draw 300ms cubic-bezier(.3,0,.2,1) var(--t-guide) forwards,
                            pl-out 220ms ease var(--t-guideout) forwards;}

@keyframes pl-in{to{opacity:1}}
@keyframes pl-out{to{opacity:0}}

@media (max-width:600px){
  .pl-coord{font-size:9px;letter-spacing:.18em;}
  .pl-coord-tl,.pl-coord-tr{top:18px;}
  .pl-coord-bl,.pl-coord-br{bottom:18px;}
  .pl-coord-tl,.pl-coord-bl{left:18px;}
  .pl-coord-tr,.pl-coord-br{right:18px;}
}
/* the head script never arms the loader under reduced motion; this is the belt-and-braces */
@media (prefers-reduced-motion:reduce){
  #ank-pl,#ank-pl.pl-run{display:none!important;}
}
</style>

<script id="ank-pl-js">
(function () {
  var root = document.documentElement;
  var el = document.getElementById("ank-pl");
  if (!el) return;
  // The head snippet is the only thing that decides whether we play; if it opted
  // out (reduced motion, already seen this session, no JS) the node just goes away.
  if (!root.classList.contains("ank-pl")) { el.remove(); return; }
  try { sessionStorage.setItem("ank-pl-seen", "1"); } catch (e) {}

  var done = false;
  var timers = [];

  // Released while the sheet is still opaque: taking the scroll lock off brings
  // the scrollbar back and reflows the page, and that must not happen in view.
  function unlock() { root.classList.remove("ank-pl-lock"); }
  function reveal() { unlock(); root.classList.remove("ank-pl"); }
  function finish() {
    if (done) return;
    done = true;
    reveal();
    timers.forEach(clearTimeout);
    el.remove();
    window.removeEventListener("keydown", skip);
  }
  function skip() {
    if (done) return;
    reveal();
    el.classList.add("is-skip");           // animationend below still lands the finish
    timers.push(setTimeout(finish, 400));
  }

  // The fade and the hand-off run on the same animation clock, so the page is
  // revealed on the frame the overlay starts going transparent — never before it
  // is invisible, never long after.
  el.addEventListener("animationstart", function (e) {
    if (e.animationName === "pl-handoff") reveal();
  });
  el.addEventListener("animationend", function (e) {
    if (e.animationName === "pl-exit") finish();
  });

  el.classList.add("pl-run");

  var cs = getComputedStyle(el);
  var exitAt = parseFloat(cs.getPropertyValue("--t-exit")) || 2980;
  timers.push(setTimeout(unlock, Math.max(0, exitAt - 180)));

  // Backstop for the case where animation events never arrive.
  timers.push(setTimeout(reveal, exitAt + 60), setTimeout(finish, exitAt + 1150));

  el.addEventListener("click", skip);
  window.addEventListener("keydown", skip);
})();
</script>
